# 注文処理タスク（在庫状況による分岐処理）
# - main: process_order（endpoint: false。内部呼び出しのみ）
# - 制御構文: branch（在庫あり/なしの2cases）
# - スコープ（ADR-023）: confirm_order / cancel_order の returns は分岐外で参照しない。
#   各パスは独立して終端（floating node）→ DAG では END に直行
#
# ADR-040:
#   - branch.params は branch node 自身の判定入力としてのみ扱う。
#   - case entry task への params wiring は cases[].params に明示する。

nodes:
  - id: process_order
    type: task
    main: true
    endpoint: false
    params:
      - name: order_id
        model: str
        note: "対象注文ID"
    note: |
      在庫状況に応じて confirm（在庫充足）/ cancel（在庫不足）に分岐する。
      returns なし（各分岐先 task が order_db を更新して終端、DAG的には END へfloating）。

  - id: check_inventory
    type: task
    endpoint: false
    params:
      - name: order_id
        model: str
    returns:
      name: order
      model: order
    reads:
      - order_db
      - catalog.store.inventory_db
    note: |
      order_id から order を引き当て、含まれる order_item の在庫を inventory_db で照合。
      条件評価そのものは branch ノード側の note + cases.label が表現する。

  - id: route_by_inventory
    type: branch
    params:
      - name: order
        model: order
    note: |
      order に紐づく全 order_item について inventory_db.stock >= order_item.qty なら in_stock、
      1件でも不足があれば out_of_stock。

  - id: confirm_order
    type: task
    endpoint: false
    params:
      - name: order
        model: order
    writes:
      - order_db
    note: |
      在庫充足パス。order_db の order.status を confirmed に更新して終端。
      下流 wiring 不要（floating node → END、ADR-023）。

  - id: cancel_order
    type: task
    endpoint: false
    params:
      - name: order
        model: order
    writes:
      - order_db
    note: |
      在庫不足パス。order_db の order.status を cancelled に更新して終端。
      下流 wiring 不要（floating node → END、ADR-023）。

flow:
  - step: check_inventory
    params:
      order_id: $params.order_id

  - branch: route_by_inventory
    params:
      order: check_inventory
    cases:
      - label: in_stock
        step: confirm_order
        params:
          order: check_inventory
      - label: out_of_stock
        step: cancel_order
        params:
          order: check_inventory