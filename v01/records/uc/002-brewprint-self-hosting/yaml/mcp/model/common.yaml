# MCP object selector
# docs/spec/mcp/schema.md §1.1 に対応。

nodes:
  - id: mcp_object_type
    type: model
    kind: enum
    values:
      - node
      - view
      - transition
      - asset
      - field
      - file
      - primitive
    note: "MCP ObjectRef / selector で使う object category。"

  - id: mcp_diagnostic_severity
    type: model
    kind: enum
    values:
      - error
      - warning
      - info
      - hint
    note: "MCP Diagnostic severity。"

  - id: reference_tree_direction
    type: model
    kind: enum
    values:
      - out
      - in
      - both
    note: "get_reference_tree traversal direction。"

  - id: reference_kind
    type: model
    kind: enum
    values:
      - param_model
      - return_model
      - produces_asset
      - consumes_asset
      - reads
      - writes
      - store_of
      - field_type
      - field_fk
      - transition_event
      - transition_from
      - transition_to
      - transition_action
      - event_payload
      - event_actor
      - event_watches
      - scenario_state_file
      - scenario_step_transition
    note: "semantic reference kind。reference.kind / get_reference_tree_edge.kind / get_reference_tree_node.via で使う。"

  - id: reference_direction
    type: model
    kind: enum
    values:
      - out
      - in
    note: "semantic reference direction。out / in のみ。get_references_response.direction 等 both を含む query direction には reference_query_direction を使う。"

  - id: object_selector
    type: model
    kind: struct
    fields:
      - name: id
        type: str
        note: "対象object ID。QualifiedID / actor global ID / synthetic IDを許容。任意"
      - name: object
        type: mcp_object_type
        note: "任意。node / view / transition / asset / field / file / primitive。"
      - name: kind
        type: str
        note: "任意。期待kind。値集合はobject-dependentであり、正本は docs/spec/mcp/schema.md §1.1 object-dependent kind vocabulary。指定時は解決結果との一致を検証する。"
      - name: file
        type: str
        note: "FileID。file-local object指定時に使う。任意"
      - name: local_id
        type: str
        note: "file内local object ID。sub task / field / asset等で使う。任意"
    note: |
      MCP tool共通のselector。
      JSON schema上は全field任意だが、toolごとに有効な組み合わせが制約される。
      selector field combination / object-dependent kind vocabulary / tool support matrix の正本は docs/spec/mcp/schema.md §1.1〜§1.2 と各 tool spec。
      このYAMLはUC-002上のmodel表現であり、DATA DSLにdependent enumやselector matrix validationを導入するものではない。
