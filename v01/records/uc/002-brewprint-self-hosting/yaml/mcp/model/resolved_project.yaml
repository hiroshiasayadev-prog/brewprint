# MCP ResolvedProject payload model
# ADR-047 / ADR-048 の ResolvedProject 境界に対応。

nodes:
  - id: resolved_project
    type: model
    kind: struct
    fields:
      - name: semantic_objects
        type: any
        note: |
          解決済みnode / view / transition / asset / field / file等のregistry。
          具体的なindex構造はGo実装内部のResolvedProject責務であり、MCP公開contractでは直接公開しない。
      - name: reference_indexes
        type: any
        note: |
          referencesBySource / referencesByTarget等のsemantic reference index。
          v1 modelでは任意のmap / union value / 実装内部index shapeを表せないためany。
      - name: render_context
        type: any
        note: |
          render_index.yaml解決後のgroup / output mapping等。
          analyze_impact のrender_output_files等の材料になるが、公開schemaとしては固定しない。
      - name: diagnostics
        type: diagnostic_list
        note: "semantic build時に得られたdiagnostic。任意"
    note: |
      QueryService / MCP wrapper が読む解決済みproject contextの概念model。
      実際の保持先は store kind: context の resolved_project_store として表す想定。
      Raw YAML ASTではなく、validation / name resolution / derived model build / index build後のsemantic modelを指す。
      内部indexや任意mapはv1 modelでは厳密表現できないためanyで暫定表現する。
