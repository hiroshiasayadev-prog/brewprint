# 認証情報（ユーザー識別エンティティ兼任）
# username を pk とし、cart/order の user_id クロスモジュールFKの参照先となる（ADR-033）

nodes:
  - id: credential
    type: model
    main: true
    kind: struct
    fields:
      - name: username
        type: str
        pk: true
        note: "ユーザー名（PK）。他モジュールからの user_id FK 参照先"
      - name: password
        type: str
        note: "パスワード。実装ではハッシュ化して保存する（本UCでは型だけ示す）"
      - name: created_at
        type: datetime
        note: "アカウント作成日時"
