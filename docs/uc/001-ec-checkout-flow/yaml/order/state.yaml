# 注文FSM
# カート→チェックアウト→決済→確定/失敗 のフロー
# - 5種のstate: cart (initial) / checkout_screen / processing / confirmed (final) / failed (final)
# - 4種のevent: view_checkout / view_cart / checkout_submitted / payment_webhook_received
# - source: external（stripe webhook）をここでカバー
# - guard を payment_webhook_received の payload.status 判定で使用
# - wireframe を cart / checkout_screen で定義（header/footer/card/grid/row/badge/image/divider/select/checkbox 等を散らす）
#
# 参照ADR:
# - ADR-017: 三層モデル（Applicationレイヤー）
# - ADR-018: event source定義
# - ADR-019: stateノード設計、transitions セクション
# - ADR-029: wireframe DSL
# - ADR-031: actor はプロジェクトglobal（actors.yaml）

nodes:
  # ── state ──

  - id: cart
    type: state
    initial: true
    note: "カート内容を確認する画面（購入手続き開始前）"
    wireframe:
      type: col
      children:
        - type: header
          id: cart_header
          children:
            - type: text
              id: cart_header_title
              label: "ショッピングカート"
        - type: col
          id: cart_body
          children:
            - type: text
              id: cart_items_label
              label: "カート内アイテム"
            - type: divider
              id: items_divider
            - type: row
              id: item_row
              children:
                - type: image
                  id: item_thumbnail
                - type: col
                  id: item_info_col
                  children:
                    - type: text
                      id: item_name
                      label: "商品名"
                    - type: badge
                      id: shipping_badge
                      label: "送料無料"
            - type: button
              id: proceed_button
              label: "購入手続きへ"
              fires: view_checkout
        - type: footer
          id: cart_footer
          children:
            - type: text
              id: cart_total_label
              label: "合計金額"

  - id: checkout_screen
    type: state
    note: "配送先・支払い方法の入力画面"
    wireframe:
      type: col
      children:
        - type: card
          id: shipping_card
          children:
            - type: text
              id: shipping_title
              label: "配送先情報"
            - type: grid
              id: address_grid
              cols: 2
              children:
                - type: input
                  id: postal_code_input
                  label: "郵便番号"
                  placeholder: "123-4567"
                  span: 1
                - type: input
                  id: prefecture_input
                  label: "都道府県"
                  span: 1
                - type: input
                  id: address_full_input
                  label: "番地・建物名"
                  placeholder: "東京都千代田区..."
                  span: 2
        - type: card
          id: payment_card
          children:
            - type: text
              id: payment_title
              label: "支払い方法"
            - type: select
              id: payment_method_select
              label: "支払い方法を選択"
            - type: checkbox
              id: tos_agree_checkbox
              label: "利用規約に同意する"
        - type: button
          id: confirm_button
          label: "注文を確定する"
          fires: checkout_submitted

  - id: processing
    type: state
    note: "order.task.checkout 起動後、Stripe webhook 受信待ち"

  - id: confirmed
    type: state
    final: true
    note: "決済成功・注文確定の終端状態"

  - id: failed
    type: state
    final: true
    note: "決済失敗の終端状態。再購入には view_cart で cart 状態へ戻る"

  # ── event ──

  - id: view_checkout
    type: event
    source: ui
    note: "「購入手続きへ」ボタンクリックによる画面遷移"

  - id: view_cart
    type: event
    source: ui
    note: "カート画面への復帰（failed からの再試行パス）"

  - id: checkout_submitted
    type: event
    source: ui
    note: |
      「注文を確定する」ボタンクリック。
      送信データはshipping情報・支払い方法選択・同意フラグ・カート内容などの複合だが、
      brewprintのpayloadは単一model参照のため、ここではpayloadを省略してnoteで記述する。
      実装上はorder.task.checkoutのparams（cart, user_id 等）が対応する。

  - id: payment_webhook_received
    type: event
    source: external
    actor: stripe
    payload:
      model: payment_event
    note: |
      Stripe webhook受信（POST /api/webhooks/stripe）。
      actor: stripe はプロジェクトglobalなactors.yamlに定義（ADR-031）。
      payload.status で成否を判定し、guardで分岐する。

transitions:
  # カート → チェックアウト画面
  - from: cart
    on: view_checkout
    to: checkout_screen

  # 失敗からカートへ復帰
  - from: failed
    on: view_cart
    to: cart
    note: "終端 failed からの再購入パス"

  # チェックアウト → 決済処理中
  - from: checkout_screen
    on: checkout_submitted
    to: processing
    action: order.task.checkout
    note: |
      order.task.checkout（order/task/checkout.yaml、クロスファイル参照）を呼び出す。
      内部は fork+join で複数処理を並列化。

  # 決済成功
  - from: processing
    on: payment_webhook_received
    to: confirmed
    action: payment.task.process_payment
    guard: "payload.status == 'succeeded'"
    note: |
      Stripe決済成功。
      payment.task.process_payment（payment/task/process_payment.yaml、クロスファイル）で
      order_db に反映する。

  # 決済失敗
  - from: processing
    on: payment_webhook_received
    to: failed
    guard: "payload.status == 'failed'"
    note: "Stripe決済失敗。order_dbへの反映は行わない（action なし）"
