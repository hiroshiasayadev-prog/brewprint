# カート内アイテム。cart と catalog.item の N:M 中間model
# ADR-026: N:M は中間model + surrogate key で表現。2本のfkを持つ
# カバレッジ: N:M 中間model、同モジュール内FK + クロスモジュールFK の両方

nodes:
  - id: cart_item
    type: model
    main: true
    kind: struct
    fields:
      - name: id
        type: str
        pk: true
        note: "中間テーブルのsurrogate key（PK / ADR-026）"
      - name: cart_id
        type: str
        fk: cart.id
        note: "所属カート。同モジュール内FK（bare ID参照）"
      - name: item_id
        type: str
        fk: catalog.model.item.id
        note: "商品参照。catalog モジュールへのクロスモジュールFK（ADR-033）"
      - name: qty
        type: int
        note: "数量"
