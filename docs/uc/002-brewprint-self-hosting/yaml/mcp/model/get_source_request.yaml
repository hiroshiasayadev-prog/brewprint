# MCP get_source request
# docs/spec/mcp/tools/get-source.md §2 に対応。

nodes:
  - id: get_source_request
    type: model
    kind: struct
    fields:
      - name: selector
        type: object_selector
        note: "必須。source snippet取得対象のsemantic object selector。"
      - name: fallback
        type: str
        note: "任意。file / error。省略時は MCP tool contract により file相当。"
    note: |
      MCP tool `get_source` のrequest model。
      docs/spec/mcp/tools/get-source.md §2 のInputに対応する。
      fallback=file または省略時はobject単位rangeが取れない場合に同一FileID全体を返す。
      fallback=error の場合はobject単位rangeが特定できないとtool errorを返す。
      fallbackのdefault、分岐、未知値errorはMCP tool specを正本とし、このYAMLでは要約だけを保持する。
