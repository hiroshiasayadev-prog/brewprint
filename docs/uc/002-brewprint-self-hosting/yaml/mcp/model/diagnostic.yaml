# MCP Diagnostic

nodes:
  - id: diagnostic
    type: model
    kind: struct
    fields:
      - name: severity
        type: mcp_diagnostic_severity
        note: "error / warning / info / hint"
      - name: code
        type: str
        note: "machine-readable diagnostic code"
      - name: message
        type: str
        note: "human-readable message"
      - name: source
        type: source_location
        note: "関連source。任意"
      - name: related
        type: list<diagnostic_related>
        note: "関連SourceLocationまたはObjectRefのtagged union envelope配列。任意。"
    note: "tool実行は成立したが注意すべき情報。"
