# MCP list_objects request
# docs/spec/mcp/tools/list-objects.md §2 に対応。

nodes:
  - id: list_objects_object_filter
    type: model
    kind: enum
    values:
      - node
      - view
      - transition
      - field
    note: "list_objects_request.object filter。省略時は全object種別を対象にする。mcp_object_type より狭い list-objects-specific filter。"

  - id: list_objects_request
    type: model
    kind: struct
    fields:
      - name: object
        type: list_objects_object_filter
        note: "任意。省略時は全object種別を対象にする。"
      - name: kind
        type: str
        note: "任意。object-dependent kind filter。値集合とobject省略時の扱いは docs/spec/mcp/tools/list-objects.md §2 と docs/spec/mcp/schema.md §1.1 を正本とする。"
      - name: module
        type: str
        note: "任意。module path。例: order, payment.webhooks。"
      - name: file
        type: str
        note: "任意。FileID。yaml/ からのslash正規化相対path。"
    note: |
      MCP tool `list_objects` のrequest model。
      docs/spec/mcp/tools/list-objects.md §2 のInputに対応する。
      `kind` は object-dependent filterであり、正本は docs/spec/mcp/tools/list-objects.md §2 と docs/spec/mcp/schema.md §1.1。
      このYAMLはUC-002上のmodel表現であり、DATA DSLにdependent enumを導入するものではない。
