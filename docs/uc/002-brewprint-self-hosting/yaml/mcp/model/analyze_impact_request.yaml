# MCP analyze_impact request
# docs/spec/mcp/tools/analyze-impact.md §2〜§3 に対応。

nodes:
  - id: analyze_impact_request
    type: model
    kind: struct
    fields:
      - name: selector
        type: object_selector
        note: "必須。影響分析対象のObject selector。"
      - name: change
        type: analyze_impact_change
        note: "必須。kindをdiscriminatorとする変更種別object。rename/remove/change_type/addは構造化済み。change_contract / change_transition_targetは後続migration対象。"
      - name: scope_modules
        type: string_list
        note: "任意。分析範囲を絞るmodule list。"
      - name: max_impacts
        type: int
        note: "任意。impact返却上限。省略時200。"
    note: |
      MCP tool `analyze_impact` のrequest model。
      docs/spec/mcp/tools/analyze-impact.md §2 のInput、および §3 のchange discriminated objectに対応する。
      `change.kind` ごとのpayload制約:
      - rename: new_id必須
      - remove: 追加payload不可
      - change_type: new_type必須
      - change_contract: note任意、payloadなしでも有効
      - change_transition_target: new_to / new_action の少なくとも一方が必要
      - add: added_id必須
      kindとpayloadの不正な組み合わせは invalid_change_payload tool error。
      change fieldはanalyze_impact_changeモデルに移行した。change_contract / change_transition_targetは後続migration対象。
