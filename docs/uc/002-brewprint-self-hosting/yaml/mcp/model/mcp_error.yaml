# MCP error payload
# docs/spec/mcp/errors.md §3 に対応。

nodes:
  - id: mcp_error_code
    type: model
    kind: enum
    values:
      - project_invalid
      - invalid_args
      - invalid_selector
      - invalid_change_payload
      - not_found
      - kind_mismatch
      - ambiguous
      - unsupported_object
      - unsupported_detail
      - unsupported_direction
      - invalid_depth
      - internal_error
    note: "MCP tool error code。docs/spec/mcp/errors.md §3 の closed 値集合。"

  - id: mcp_error
    type: model
    kind: struct
    fields:
      - name: code
        type: mcp_error_code
        note: "error code。"
      - name: message
        type: str
        note: "human-readable error message。必須"
      - name: selector
        type: object_selector
        note: "入力selector。selector解決に関係するerrorの場合のみ"
      - name: diagnostics
        type: diagnostic_list
        note: "関連diagnostic。任意"
    note: |
      MCP tool実行自体が成立しない場合に返すtool error payload。
      JSON-RPC envelopeそのものではなく、brewprint MCP error bodyを表す。
