# MCP ObjectRef
# docs/spec/mcp/schema.md §1.7 に対応。

nodes:
  - id: object_ref
    type: model
    kind: struct
    fields:
      - name: object
        type: mcp_object_type
        note: "node / view / transition / asset / field / file / primitive"
      - name: kind
        type: str
        note: "object-dependent kind。値集合の正本は docs/spec/mcp/schema.md §1.1 object-dependent kind vocabulary。nodeならtask/model/store等。"
      - name: id
        type: str
        note: "object ID。QualifiedIDまたはsynthetic ID"
      - name: qualified_id
        type: str
        note: "QualifiedIDを持つobjectのみ。任意"
      - name: file
        type: str
        note: "file-local objectの所属FileID。任意"
      - name: local_id
        type: str
        note: "file-local objectのlocal ID。任意"
      - name: label
        type: str
        note: "人間向け短縮表示名。任意"
      - name: source
        type: source_location
        note: "定義元source。任意"
      - name: parent
        type: object_ref
        note: "field等の親ObjectRef。recursive named model reference。"
    note: |
      MCP response内でsemantic objectを指す共通形式。
      `object` と `kind` の組み合わせは docs/spec/mcp/schema.md §1.1 の object-dependent kind vocabulary を正本とする。
      parentはfield等の親ObjectRefをrecursive named model referenceとして表す。
      このYAMLはUC-002上のmodel表現であり、DATA DSLにdependent enumやinline recursive shapeを導入するものではない。
