# MCP get_reference_tree response
# docs/spec/mcp/tools/get-reference-tree.md §3〜§6 に対応。

nodes:
  - id: get_reference_tree_response
    type: model
    main: true
    kind: struct
    fields:
      - name: root
        type: object_ref
        note: "必須。traversal root ObjectRef。"
      - name: direction
        type: reference_tree_direction
        note: "必須。実際に使ったdirection。out / in / both。"
      - name: depth
        type: int
        note: "必須。実際に使ったmax traversal depth。"
      - name: nodes
        type: list<get_reference_tree_node>
        note: "必須。到達object entry配列。各entryは object:ObjectRef / depth:int / via:reference_kind[] を持つ。"
      - name: edges
        type: list<get_reference_tree_edge>
        note: "必須。traversalで辿ったReference entry配列。Referenceにdepth:intを加えたshape。継承 / extensionは使わずsame-file helperで表す。"
      - name: truncated
        type: bool
        note: "必須。max_nodes / max_edges により打ち切ったか。"
      - name: truncated_reasons
        type: string_list
        note: "必須。max_nodes / max_edges 等の打ち切り理由文字列配列。"
      - name: diagnostics
        type: diagnostic_list
        note: "必須。Diagnostic list。"
    note: |
      MCP tool `get_reference_tree` のresponse model。
      docs/spec/mcp/tools/get-reference-tree.md §3 のOutput、§4 Node entry、§5 Edge entry、§6 Traversal semanticsに対応する。
      tool名はtreeだが返却形式は nodes[] / edges[] からなるbounded reference graph。

  - id: get_reference_tree_node
    type: model
    kind: struct
    fields:
      - name: object
        type: object_ref
        note: "必須。到達したObjectRef。"
      - name: depth
        type: int
        note: "必須。rootからの最短到達hop数。"
      - name: via
        type: list<reference_kind>
        note: "必須。rootから最初に到達したBFS経路のReference.kind列。"
    note: "`get_reference_tree_response.nodes[]` のresponse-local helper model。"

  - id: get_reference_tree_edge
    type: model
    kind: struct
    fields:
      - name: kind
        type: reference_kind
        note: "必須。semantic reference kind。"
      - name: direction
        type: reference_direction
        note: "必須。query対象から見た方向。out / in。"
      - name: from
        type: object_ref
        note: "必須。参照元object。"
      - name: to
        type: object_ref
        note: "必須。参照先object。"
      - name: source
        type: source_location
        note: "任意。このreferenceの定義元。"
      - name: doc
        type: str
        note: "任意。reference補足。"
      - name: depth
        type: int
        note: "必須。そのedgeを発見したtraversal hop。"
    note: |
      `get_reference_tree_response.edges[]` のresponse-local helper model。
      v1 modelには継承 / extensionがないため、`reference`にdepthを足したshapeを明示的に再掲する。
