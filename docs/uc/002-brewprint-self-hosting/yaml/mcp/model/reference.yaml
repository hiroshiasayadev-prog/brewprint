    type: model
    kind: struct
    fields:
      - name: kind
        type: str
        note: "enum値集合: param_model / return_model / produces_asset / consumes_asset / reads / writes / store_of / field_type / field_fk / transition_event / transition_from / transition_to / transition_action / event_payload / event_actor / event_watches / scenario_state_file / scenario_step_transition"
