# MCP Reference
# docs/spec/mcp/schema.md §2 に対応。

nodes:
  - id: reference
    type: model
    kind: struct
    fields:
      - name: kind
        type: reference_kind
        note: "semantic reference kind。"
      - name: direction
        type: reference_direction
        note: "query対象から見た方向。out / in。"
      - name: from
        type: object_ref
        note: "参照元object"
      - name: to
        type: object_ref
        note: "参照先object"
      - name: source
        type: source_location
        note: "このreferenceの定義元。任意"
      - name: doc
        type: str
        note: "reference補足。任意"
    note: "ResolvedProject上のsemantic object間の直接参照。"
