        type: str
        note: "enum値集合: out / in。query対象から見た方向"
      - name: from
        type: object_ref
        note: "参照元object"
      - name: to
        type: object_ref
        note: "参照先object"
      - name: source
        type: source_location
        note: "このreferenceの定義元。任意"
      - name: doc
        type: str
        note: "reference補足。任意"
    note: "ResolvedProject上のsemantic object間の直接参照。"
