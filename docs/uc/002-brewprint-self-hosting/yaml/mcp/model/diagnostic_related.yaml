# MCP Diagnostic related item

nodes:
  - id: diagnostic_related
    type: model
    kind: tagged_union
    discriminator: kind
    variants:
      - tag: source_location
        fields:
          - name: location
            type: source_location
            note: "関連source位置。"
      - tag: object_ref
        fields:
          - name: object
            type: object_ref
            note: "関連semantic object。"
    note: |
      diagnostic.related の要素を表す tagged union envelope。
      以前の untagged SourceLocation | ObjectRef list を machine-readable な envelope model に置き換える。
