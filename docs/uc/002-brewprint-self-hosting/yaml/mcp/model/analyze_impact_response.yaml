# MCP analyze_impact response
# docs/spec/mcp/tools/analyze-impact.md §4〜§12 に対応。

nodes:
  - id: analyze_impact_response
    type: model
    main: true
    kind: struct
    fields:
      - name: target
        type: object_ref
        note: "必須。分析対象ObjectRef。"
      - name: change
        type: analyze_impact_change
        note: "必須。inputで指定されたchangeをそのまま返す。"
      - name: summary
        type: analyze_impact_summary
        note: "必須。by_severity / by_fixability / by_kind の件数集計object。"
      - name: impacts
        type: list<analyze_impact_impact>
        note: "必須。impact entry配列。各entryは id / kind / severity / fixability / object / reason / via / source / recommended_action / suggested_fixes を持つ。"
      - name: coverage
        type: analyze_impact_coverage
        note: "必須。analyzed / not_analyzed / note を持つcoverage object。"
      - name: assumptions
        type: string_list
        note: "必須。tool側の前提・限界の文字列配列。"
      - name: truncated
        type: bool
        note: "必須。max_impactsにより打ち切ったか。"
      - name: truncated_reasons
        type: string_list
        note: "必須。打ち切り理由の文字列配列。"
      - name: diagnostics
        type: diagnostic_list
        note: "必須。unsupported selector時のunsupported_selector等を含む。"
    note: |
      MCP tool `analyze_impact` のresponse model。
      docs/spec/mcp/tools/analyze-impact.md §4 Output、§5 Impact entry、§6 severity / fixability、§7 coverage、§8 suggested_fixes、§9 SourceLocation、§10 coverage scope details、§12 assumptionsに対応する。
      `impact.severity` は breaking / warning / info。
      `impact.fixability` は mechanical / suggested / manual_review / unknown。
      `coverage.analyzed` / `coverage.not_analyzed` は `analyze_impact_coverage_vocabulary` enum の typed list で表現する。
      `suggested_fixes[]` はfix kind依存payloadを持つためany内に含める。

  - id: analyze_impact_impact
    type: model
    kind: struct
    fields:
      - name: id
        type: str
        note: "必須。response内uniqueなimpact id。"
      - name: kind
        type: str
        note: "必須。impactのsemantic kind。値集合は実装裁量のためnoteで保持する。"
      - name: severity
        type: str
        note: "必須。breaking / warning / info。enum化は別scope。"
      - name: fixability
        type: str
        note: "必須。mechanical / suggested / manual_review / unknown。enum化は別scope。"
      - name: object
        type: object_ref
        note: "必須。影響を受けるObjectRef。render output等のidentity拡張はMCP identity follow-upで扱う。"
      - name: reason
        type: str
        note: "必須。なぜ影響するかの自然言語説明。"
      - name: via
        type: string_list
        note: "必須。rootから到達したreference kindの経路。"
      - name: source
        type: source_location
        note: "必須。影響箇所のSourceLocation。line / column欠落を許容する。"
      - name: recommended_action
        type: str
        note: "必須。人間向け推奨アクション。"
      - name: suggested_fixes
        type: any
        note: "任意。fix kind依存payloadを持つSuggestedFix配列。tagged union / discriminator表現はADR-073以降のscope。"
    note: |
      `analyze_impact_response.impacts[]` のresponse-local helper model。
      severity / fixability の値集合と suggested_fixes のkind依存payloadは、このmigrationではnoteに保持する。

  - id: analyze_impact_coverage_vocabulary
    type: model
    kind: enum
    values:
      - direct_references
      - reference_tree
      - model_field_resolution
      - transition_action_resolution
      - flow_step_task_resolution
      - flow_param_field_resolution
      - sequence_step_task_resolution
      - type_signature_identity
      - render_output_files
      - name_collision
      - type_structural_compatibility
      - semantic_contract_compatibility
      - render_presentation_details
      - wireframe_element_binding
    note: "analyze_impact coverage vocabulary。v1 標準語彙。docs/spec/mcp/tools/analyze-impact.md §7 に対応。"

  - id: analyze_impact_coverage
    type: model
    kind: struct
    fields:
      - name: analyzed
        type: list<analyze_impact_coverage_vocabulary>
        note: "必須。分析したcoverage語彙一覧。"
      - name: not_analyzed
        type: list<analyze_impact_coverage_vocabulary>
        note: "必須。分析していないcoverage語彙一覧。"
      - name: note
        type: str
        note: "任意。LLM向け補足説明。"
    note: |
      `analyze_impact_response.coverage` のresponse-local helper model。

  - id: analyze_impact_severity_counts
    type: model
    kind: struct
    fields:
      - name: breaking
        type: int
        note: "必須。breaking severity の件数。"
      - name: warning
        type: int
        note: "必須。warning severity の件数。"
      - name: info
        type: int
        note: "必須。info severity の件数。"
    note: "`analyze_impact_summary.by_severity` のhelper model。"

  - id: analyze_impact_fixability_counts
    type: model
    kind: struct
    fields:
      - name: mechanical
        type: int
        note: "必須。mechanical fixability の件数。"
      - name: suggested
        type: int
        note: "必須。suggested fixability の件数。"
      - name: manual_review
        type: int
        note: "必須。manual_review fixability の件数。"
      - name: unknown
        type: int
        note: "必須。unknown fixability の件数。"
    note: "`analyze_impact_summary.by_fixability` のhelper model。"

  - id: analyze_impact_summary
    type: model
    kind: struct
    fields:
      - name: by_severity
        type: analyze_impact_severity_counts
        note: "必須。severity 別件数集計。"
      - name: by_fixability
        type: analyze_impact_fixability_counts
        note: "必須。fixability 別件数集計。"
      - name: by_kind
        type: any
        note: "必須。impact kind 別件数集計。kind 語彙は実装裁量のため any を維持する。"
    note: |
      `analyze_impact_response.summary` のhelper model。
      `by_kind` は impact kind 語彙が実装裁量であり、v1 model では dict key semantics を型として表現できないため `any` を維持する。
