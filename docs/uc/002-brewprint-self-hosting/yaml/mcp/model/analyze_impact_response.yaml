# MCP analyze_impact response
# docs/spec/mcp/tools/analyze-impact.md §4〜§12 に対応。

nodes:
  - id: analyze_impact_response
    type: model
    main: true
    kind: struct
    fields:
      - name: target
        type: object_ref
        note: "必須。分析対象ObjectRef。"
      - name: change
        type: analyze_impact_change
        note: "必須。inputで指定されたchangeをそのまま返す。"
      - name: summary
        type: any
        note: "必須。by_severity / by_fixability / by_kind の件数集計object。dict shapeを厳密表現しないためany。"
      - name: impacts
        type: list<analyze_impact_impact>
        note: "必須。impact entry配列。各entryは id / kind / severity / fixability / object / reason / via / source / recommended_action / suggested_fixes を持つ。"
      - name: coverage
        type: analyze_impact_coverage
        note: "必須。analyzed / not_analyzed / note を持つcoverage object。語彙制約はnoteで保持する。"
      - name: assumptions
        type: any
        note: "必須。tool側の前提・限界の文字列配列。専用list modelを作らずanyで暫定表現する。"
      - name: truncated
        type: bool
        note: "必須。max_impactsにより打ち切ったか。"
      - name: truncated_reasons
        type: any
        note: "必須。打ち切り理由の文字列配列。専用list modelを作らずanyで暫定表現する。"
      - name: diagnostics
        type: diagnostic_list
        note: "必須。unsupported selector時のunsupported_selector等を含む。"
    note: |
      MCP tool `analyze_impact` のresponse model。
      docs/spec/mcp/tools/analyze-impact.md §4 Output、§5 Impact entry、§6 severity / fixability、§7 coverage、§8 suggested_fixes、§9 SourceLocation、§10 coverage scope details、§12 assumptionsに対応する。
      `impact.severity` は breaking / warning / info。
      `impact.fixability` は mechanical / suggested / manual_review / unknown。
      `coverage.analyzed` / `coverage.not_analyzed` はv1標準語彙を持つが、brewprint v1 modelではenum listを厳密表現できないためany + noteで保持する。
      `suggested_fixes[]` はfix kind依存payloadを持つためany内に含める。

  - id: analyze_impact_impact
    type: model
    kind: struct
    fields:
      - name: id
        type: str
        note: "必須。response内uniqueなimpact id。"
      - name: kind
        type: str
        note: "必須。impactのsemantic kind。値集合は実装裁量のためnoteで保持する。"
      - name: severity
        type: str
        note: "必須。breaking / warning / info。enum化は別scope。"
      - name: fixability
        type: str
        note: "必須。mechanical / suggested / manual_review / unknown。enum化は別scope。"
      - name: object
        type: object_ref
        note: "必須。影響を受けるObjectRef。render output等のidentity拡張はMCP identity follow-upで扱う。"
      - name: reason
        type: str
        note: "必須。なぜ影響するかの自然言語説明。"
      - name: via
        type: string_list
        note: "必須。rootから到達したreference kindの経路。"
      - name: source
        type: source_location
        note: "必須。影響箇所のSourceLocation。line / column欠落を許容する。"
      - name: recommended_action
        type: str
        note: "必須。人間向け推奨アクション。"
      - name: suggested_fixes
        type: any
        note: "任意。fix kind依存payloadを持つSuggestedFix配列。tagged union / discriminator表現はADR-073以降のscope。"
    note: |
      `analyze_impact_response.impacts[]` のresponse-local helper model。
      severity / fixability の値集合と suggested_fixes のkind依存payloadは、このmigrationではnoteに保持する。

  - id: analyze_impact_coverage
    type: model
    kind: struct
    fields:
      - name: analyzed
        type: string_list
        note: "必須。分析したcoverage語彙。標準語彙制約はnoteで保持する。"
      - name: not_analyzed
        type: string_list
        note: "必須。分析していないcoverage語彙。標準語彙制約はnoteで保持する。"
      - name: note
        type: str
        note: "任意。LLM向け補足説明。"
    note: |
      `analyze_impact_response.coverage` のresponse-local helper model。
      coverage vocabularyのenum化はこのmigrationでは行わない。
