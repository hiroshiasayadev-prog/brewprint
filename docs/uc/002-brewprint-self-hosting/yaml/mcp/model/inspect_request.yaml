# MCP inspect request
# docs/spec/mcp/tools/inspect.md §2 に対応。

nodes:
  - id: inspect_request
    type: model
    kind: struct
    fields:
      - name: selector
        type: object_selector
        note: "必須。inspect対象のObject selector。"
      - name: detail
        type: str
        note: "任意。brief / normal / full。省略時は MCP tool contract により normal。"
    note: |
      MCP tool `inspect` のrequest model。
      docs/spec/mcp/tools/inspect.md §2 のInputに対応する。
      detailは brief / normal / full のenum相当。
      MCP v1ではdetailによる厳密な返却差分は実装任意だが、未知の値はerrorとする。
      detailのdefaultと未知値errorはMCP tool specを正本とし、このYAMLでは要約だけを保持する。
