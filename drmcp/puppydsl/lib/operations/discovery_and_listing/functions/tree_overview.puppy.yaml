# responsibility: Defines tree-overview request validation, exact current-node selection orchestration, bounded breadth-first structural projection, and shared expected-error formation.
# excludes: Current-record state construction, tree-index construction, direct-child record projection, runtime-failure reporting, transport serialization, and other discovery-and-listing operations.

functions:
  operation.discovery_and_listing._validate_tree_overview_request:
    detail: Validates one exact node reference, tree-kind eligibility, depth bounds, and node-limit bounds in operation-defined order and applies every request default.
    signature: >-
      (
        request: TreeOverviewRequest,
        catalog: ArtifactModuleCatalog
      ) -> TreeOverviewRequestValidationOutcome
    implementation:
      stub: native

  operation.discovery_and_listing._build_tree_overview_result:
    detail: Selects current tree nodes through breadth-first traversal within the requested depth and node limit, renders the selected nodes as a nested structural tree, and reports node-limit truncation.
    signature: >-
      (
        node_ref: CanonicalRecordReference,
        selected: SelectedCurrentTreeNode,
        depth: integer,
        node_limit: integer
      ) -> TreeOverviewResult
    implementation:
      stub: native

  operation.discovery_and_listing._form_invalid_tree_overview_depth_error:
    detail: Forms the shared top-level invalid-depth response for a tree-overview depth outside the accepted inclusive bounds.
    signature: >-
      (
        invalid: InvalidTreeOverviewDepth
      ) -> OperationErrorResponse
    implementation:
      steps:
        diagnostic: >-
          OperationDiagnostic{
            code: OperationDiagnosticCode.invalid_depth,
            message: "The tree overview depth is outside the accepted range.",
            context: invalid.context
          }
        response: >-
          OperationErrorResponse{
            error: diagnostic
          }
      return: response

  operation.discovery_and_listing._form_invalid_tree_overview_node_limit_error:
    detail: Forms the shared top-level invalid-node-limit response for a tree-overview node limit outside the accepted inclusive bounds.
    signature: >-
      (
        invalid: InvalidTreeOverviewNodeLimit
      ) -> OperationErrorResponse
    implementation:
      steps:
        diagnostic: >-
          OperationDiagnostic{
            code: OperationDiagnosticCode.invalid_node_limit,
            message: "The tree overview node limit is outside the accepted range.",
            context: invalid.context
          }
        response: >-
          OperationErrorResponse{
            error: diagnostic
          }
      return: response

  operation.discovery_and_listing._as_tree_overview_outcome:
    detail: Preserves one complete bounded tree-overview result or shared top-level error response as the operation outcome union.
    signature: >-
      (
        outcome: TreeOverviewOutcome
      ) -> TreeOverviewOutcome
    implementation:
      stub: native

  operation.discovery_and_listing._handle_validated_tree_overview:
    detail: Selects one exact current tree node and builds its bounded breadth-first structural overview or returns the shared node-not-found response.
    requires:
      - current_record.state
    signature: >-
      (
        request: ValidatedTreeOverviewRequest
      ) -> TreeOverviewOutcome
    implementation:
      steps:
        node_selection: >-
          operation.discovery_and_listing._select_current_tree_node(
            state: current_record.state,
            node_ref: request.node_ref,
            app_namespace: request.app_namespace,
            artifact_kind: request.artifact_kind
          )

        outcome:
          switch: node_selection
          cases:
            SelectedCurrentTreeNode:
              steps:
                result: >-
                  operation.discovery_and_listing._build_tree_overview_result(
                    node_ref: request.node_ref,
                    selected: node_selection,
                    depth: request.depth,
                    node_limit: request.node_limit
                  )
                selected: >-
                  operation.discovery_and_listing._as_tree_overview_outcome(
                    outcome: result
                  )
              return: selected

            TreeNodeNotFoundContext:
              steps:
                error: >-
                  operation.discovery_and_listing._form_current_tree_node_not_found_error(
                    context: node_selection
                  )
                unavailable: >-
                  operation.discovery_and_listing._as_tree_overview_outcome(
                    outcome: error
                  )
              return: unavailable
      return: outcome

  operation.discovery_and_listing.inspect_tree:
    detail: Inspects one exact current tree subtree through bounded breadth-first selection and returns a nested structural overview.
    requires:
      - artifact_modules.catalog
    opens:
      - repository_discovery
      - current_record
    signature: >-
      (
        request: TreeOverviewRequest
      ) -> TreeOverviewOutcome
    implementation:
      steps:
        validation: >-
          operation.discovery_and_listing._validate_tree_overview_request(
            request: request,
            catalog: artifact_modules.catalog
          )

        outcome:
          switch: validation
          cases:
            ValidatedTreeOverviewRequest:
              steps:
                selected: >-
                  operation.discovery_and_listing._handle_validated_tree_overview(
                    request: validation
                  )
              return: selected

            InvalidTreeNodeSelectorContext:
              steps:
                error: >-
                  operation.discovery_and_listing._form_invalid_tree_node_selector_error(
                    context: validation
                  )
                selected: >-
                  operation.discovery_and_listing._as_tree_overview_outcome(
                    outcome: error
                  )
              return: selected

            InvalidTreeOverviewDepth:
              steps:
                error: >-
                  operation.discovery_and_listing._form_invalid_tree_overview_depth_error(
                    invalid: validation
                  )
                selected: >-
                  operation.discovery_and_listing._as_tree_overview_outcome(
                    outcome: error
                  )
              return: selected

            InvalidTreeOverviewNodeLimit:
              steps:
                error: >-
                  operation.discovery_and_listing._form_invalid_tree_overview_node_limit_error(
                    invalid: validation
                  )
                selected: >-
                  operation.discovery_and_listing._as_tree_overview_outcome(
                    outcome: error
                  )
              return: selected
      return: outcome
